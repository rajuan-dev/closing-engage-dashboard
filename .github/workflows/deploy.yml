name: Dashboard CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: closing-engage-dashboard-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    concurrency:
      group: closing-engage-production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${EC2_PORT:-22}" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
        run: |
          set -eu
          ssh -p "${EC2_PORT:-22}" "${EC2_USER}@${EC2_HOST}" "EC2_PROJECT_PATH='${EC2_PROJECT_PATH}' bash -se" <<'EOF'
          set -euo pipefail

          PROJECT_PATH="${EC2_PROJECT_PATH:?EC2_PROJECT_PATH secret is required}"
          BRANCH="main"
          LOCK_FILE="/tmp/closing-engage-compose-deploy.lock"
          export PROJECT_PATH BRANCH

          deploy() {
            for repo in closing-engage-backend closing-engage-dashboard closing-engage-website; do
              if [ ! -d "$PROJECT_PATH/$repo/.git" ]; then
                echo "Missing git repo at $PROJECT_PATH/$repo"
                exit 1
              fi

              git -C "$PROJECT_PATH/$repo" fetch origin "$BRANCH"
              git -C "$PROJECT_PATH/$repo" checkout "$BRANCH"
              git -C "$PROJECT_PATH/$repo" reset --hard "origin/$BRANCH"
            done

            cd "$PROJECT_PATH"
            docker compose up -d --build
            docker compose ps
          }

          if command -v flock >/dev/null 2>&1; then
            flock -w 900 "$LOCK_FILE" bash -c "$(declare -f deploy); deploy"
          else
            deploy
          fi
          EOF
